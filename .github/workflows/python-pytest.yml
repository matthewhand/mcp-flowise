name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Frozen install: exactly what uv.lock pins, so CI cannot drift.
      - name: Install dependencies
        run: uv sync --frozen

      # The whole suite runs offline against the task-owned mock Flowise
      # (tests/mock_flowise.py); no Flowise deployment or network egress needed.
      # Live-deployment checks are skipped unless FLOWISE_API_* is provided.
      - name: Run tests
        run: uv run --frozen pytest tests -q

      - name: Show dependency versions used by CI
        run: uv run --frozen python -c "import sys, importlib.metadata as m; print(sys.version); print('mcp', m.version('mcp'))"
