name: Python Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.13.3'
      - name: Install locked dependencies
        run: uv sync --frozen --group dev --python ${{ matrix.python }}
      - name: Run offline suite including stdio protocol checks
        run: uv run --frozen pytest -q
