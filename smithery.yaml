# Smithery configuration file: https://smithery.ai/docs/deployments

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    # Defaults here mirror the server's real defaults (see README.md).
    type: object
    required:
      - flowiseApiKey
    properties:
      flowiseApiKey:
        type: string
        description: Your Flowise API Bearer token
      flowiseApiEndpoint:
        type: string
        default: http://localhost:3000
        description: Base URL for Flowise
      flowiseMode:
        type: string
        enum: [simple, lowlevel]
        default: simple
        description: >
          simple (default): list_chatflows + create_prediction tools.
          lowlevel: one tool per allowed chatflow, discovered at start-up.
      flowiseChatflowId:
        type: string
        description: >
          Single chatflow ID used by create_prediction when the client does not
          pass one (simple mode). Leave empty to require the argument.
      flowiseChatflowDescriptions:
        type: string
        description: >
          Comma-separated "id:description" pairs used as tool descriptions
          (lowlevel mode).
      flowiseWhitelistId:
        type: string
        description: >
          Comma-separated chatflow IDs to allow. If any whitelist rule is set,
          only matching chatflows are exposed and blacklists are irrelevant.
      flowiseBlacklistId:
        type: string
        description: Comma-separated chatflow IDs to deny (only used when no whitelist rule is set)
      flowiseWhitelistNameRegex:
        type: string
        description: Regular expression; matching chatflow names are allowed
      flowiseBlacklistNameRegex:
        type: string
        description: Regular expression; matching chatflow names are denied
  commandFunction: |-
    (config) => {
      const env = {
        FLOWISE_API_KEY: config.flowiseApiKey,
        FLOWISE_API_ENDPOINT: config.flowiseApiEndpoint || 'http://localhost:3000',
        FLOWISE_MODE: config.flowiseMode === 'lowlevel' ? 'lowlevel' : 'simple',
        FLOWISE_CHATFLOW_ID: config.flowiseChatflowId || '',
        FLOWISE_CHATFLOW_DESCRIPTIONS: config.flowiseChatflowDescriptions || '',
        FLOWISE_WHITELIST_ID: config.flowiseWhitelistId || '',
        FLOWISE_BLACKLIST_ID: config.flowiseBlacklistId || '',
        FLOWISE_WHITELIST_NAME_REGEX: config.flowiseWhitelistNameRegex || '',
        FLOWISE_BLACKLIST_NAME_REGEX: config.flowiseBlacklistNameRegex || '',
      };
      for (const key of Object.keys(env)) {
        if (env[key] === '') { delete env[key]; }
      }
      return {command: 'uvx', args: ['--from', 'git+https://github.com/matthewhand/mcp-flowise', 'mcp-flowise'], env};
    }
