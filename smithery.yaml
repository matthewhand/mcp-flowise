# Smithery configuration file: https://smithery.ai/docs/deployments

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - flowiseApiKey
    properties:
      flowiseApiKey:
        type: string
        description: Your Flowise API Bearer token
      flowiseApiEndpoint:
        type: string
        default: http://localhost:3000
        description: Base URL for Flowise
      flowiseSimpleMode:
        type: boolean
        default: true
        description: Enable FastMCP mode for simpler configuration
      flowiseChatflowId:
        type: string
        description: Single Chatflow ID for FastMCP mode (optional)
  commandFunction:
    # A function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({command: 'mcp-flowise', args: [], env: {FLOWISE_API_KEY: config.flowiseApiKey, FLOWISE_API_ENDPOINT: config.flowiseApiEndpoint || 'http://localhost:3000', FLOWISE_SIMPLE_MODE: config.flowiseSimpleMode === false ? 'false' : 'true', FLOWISE_CHATFLOW_ID: config.flowiseChatflowId || ''}})
